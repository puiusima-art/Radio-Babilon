### Pasul de rezolvare (Simplu, cu JAWS)

1. Mergi în GitHub la fila **Code** (prima filă din stânga).
2. Intra în dosarul **.github**, apoi în **workflows** și dă click pe fișierul **build.yml**.
3. Apasă pe butonul cu pictograma de creion (**Edit this file** / Editează fișierul).
4. Șterge tot ce este în el (selectează tot cu **Ctrl+A** și apasă **Delete**).
5. Lipește următorul cod actualizat:


